name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ebb
          POSTGRES_PASSWORD: ebb
          POSTGRES_DB: edh_budget_brewer
        ports:
          - 5432:5432
        # Without a health check the first migrate can race the server's
        # startup and fail with "the database system is starting up".
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 50+ characters: the deploy check enforces security.W009, and
      # lowering --fail-level to accommodate a short key would defeat the
      # point of the gate. Obviously fake, and public in this file.
      SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghij-klmnop
      DEBUG: "False"
      DATABASE_URL: postgres://ebb:ebb@localhost:5432/edh_budget_brewer
      SCRYFALL_USER_AGENT: edh-budget-brewer-ci/0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check for missing migrations
        # Editing a model without running makemigrations produces confusing
        # runtime errors much later. Catch it here instead.
        run: python manage.py makemigrations --check --dry-run

      - name: Check deployment settings
        # Runs with the production env rather than the job's, so this checks
        # the settings a deploy would actually use. --fail-level WARNING is
        # the point: check --deploy exits 0 on warnings by default, so without
        # it this step can never fail.
        env:
          DEBUG: "False"
          HTTPS_ONLY: "True"
          ALLOWED_HOSTS: demo.example.com
          CSRF_TRUSTED_ORIGINS: https://demo.example.com
        run: python manage.py check --deploy --fail-level WARNING

      # --- Frontend -------------------------------------------------------
      #
      # The frontend is part of the deployable: the Dockerfile builds it and
      # Django serves it. Without these steps a TypeScript error passes CI
      # and fails the image build instead.
      #
      # Node 22 matches the Dockerfile's node:22-slim, so a build that passes
      # here is the build that ships.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        # `tsc -b && vite build` -- the typecheck is the point. Also produces
        # frontend/dist, which the next step collects.
        run: npm run build

      - name: Collect static files
        # Runs after the frontend build, so this exercises the real
        # production static pipeline: Vite's base=/static/ output through
        # WhiteNoise's manifest storage, exactly as the Dockerfile does it.
        #
        # Also stops every test that builds the middleware stack from
        # emitting "No directory at: .../staticfiles/" -- 61 warnings that
        # drown out real ones.
        run: python manage.py collectstatic --noinput

      - name: Test
        run: pytest --cov=cards --cov-report=term-missing
