# Render blueprint: free tier.
#
# One free web service and one free Postgres. Create it with Render's
# "New Blueprint" flow pointed at this repo. The two `sync: false` vars are
# prompted for at creation time, because they depend on the hostname Render
# assigns and cannot be known in advance.
#
# The free tier shapes this file in three ways, each of which would otherwise
# be a silent failure:
#
#   1. No shell and no pre-deploy command, so there is nowhere to run
#      migrations or the initial data load from. docker-entrypoint.sh does it
#      on container start instead.
#   2. No cron jobs, so there is no nightly price refresh. Prices go stale;
#      the UI reports how old they are rather than pretending otherwise.
#   3. Free Postgres expires 30 days after creation, with a 14-day grace
#      period before deletion. See DEPLOY.md for the monthly chore.
#
# DEPLOY.md is the runbook, including what to change to move to paid.

databases:
  - name: edh-budget-brewer-db
    databaseName: edh_budget_brewer
    user: ebb
    # Postgres is required, not a preference: the colour-identity filter uses
    # the array containment operator against a GIN index.
    #
    # EXPIRES 30 DAYS AFTER CREATION. Only one free database per workspace.
    plan: free
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: edh-budget-brewer
    runtime: docker
    region: oregon
    # 0.1 CPU, 512MB, spins down after 15 minutes of inactivity with a ~1
    # minute cold start.
    #
    # Memory is fine: measured at 135MiB peak during the first-boot data load
    # and 262-274MiB under a burst of concurrent five-colour brews on a paid
    # instance. CPU is the real constraint here -- an uncached five-colour
    # brew takes ~11s at 0.1 CPU versus 0.6s on a full core. The 24h brew
    # cache is what makes that tolerable: a repeat of the same brew is 0.08s.
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    #
    # No preDeployCommand: it requires a paid instance type. Migrations run in
    # docker-entrypoint.sh instead.
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edh-budget-brewer-db
          property: connectionString
      - key: DEBUG
        value: "False"
      # The public deployment is a read-only showcase: no accounts, no
      # collection, no saved decks. See issue #20 and the README.
      - key: DEMO_MODE
        value: "True"
      # Render terminates TLS in front of the app, so this also turns on
      # SECURE_PROXY_SSL_HEADER. Without that, SECURE_SSL_REDIRECT loops.
      - key: HTTPS_ONLY
        value: "True"
      # One worker. At 0.1 CPU a second buys no parallelism and costs ~50MB.
      - key: WEB_CONCURRENCY
        value: "1"
      # Cache and rate limits. The cache matters far more here than on a paid
      # instance: it is the difference between an 11s brew and an 0.08s one.
      #
      # Locmem is per-process, which is exactly right with one worker.
      - key: BREW_CACHE_SECONDS
        value: "86400"
      # Lower than the paid default of 20/min: at 0.1 CPU, 20 uncached brews
      # in a minute is far more than the instance can serve.
      - key: BREW_THROTTLE_RATE
        value: 8/min
      - key: READ_THROTTLE_RATE
        value: 60/min
      # Scryfall requires a descriptive User-Agent identifying the app.
      - key: SCRYFALL_USER_AGENT
        value: edh-budget-brewer/0.1 (+https://github.com/husomichael/edh-budget-brewer)
      # Both depend on the hostname Render assigns, so they are prompted for
      # at blueprint creation rather than guessed here.
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
